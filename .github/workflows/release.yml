name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Build executable
        shell: pwsh
        run: .\build.ps1

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item qbee_limiter_config.exe dist\
          Copy-Item qbee_limiter_monitor.exe dist\
          Copy-Item qbee_game_speed_limiter.example.json dist\qbee_game_speed_limiter.json
          Copy-Item README.zh-CN.md dist\
          Copy-Item LICENSE dist\
          Compress-Archive -Path dist\* -DestinationPath qbee-game-speed-limiter-windows.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: qbee-game-speed-limiter-windows.zip
