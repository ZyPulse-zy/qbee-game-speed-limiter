name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu

      - name: Build executable
        shell: pwsh
        run: .\build.ps1

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item qbee_limiter_config.exe dist\
          Copy-Item qbee_limiter_monitor.exe dist\
          Copy-Item qbee_game_speed_limiter.example.json dist\qbee_game_speed_limiter.json
          Copy-Item README.zh-CN.md dist\
          Copy-Item install.ps1 dist\
          Copy-Item uninstall.ps1 dist\
          Copy-Item LICENSE dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbee-game-speed-limiter-windows
          path: dist/*
