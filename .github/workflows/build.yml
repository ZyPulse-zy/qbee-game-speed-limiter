name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executable
        shell: pwsh
        run: .\build.ps1

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item qbee_game_speed_limiter.exe dist\
          Copy-Item qbee_game_speed_limiter.example.json dist\qbee_game_speed_limiter.json
          Copy-Item README.md dist\
          Copy-Item docs\USER_GUIDE.zh-CN.md dist\
          Copy-Item LICENSE dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbee-game-speed-limiter-windows
          path: dist/*
